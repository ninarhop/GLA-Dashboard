<style>
:root {
  color-scheme: light;
  --bg: #f5f7fb;
  --surface: #ffffff;
  --surface-soft: #eef5f8;
  --text: #17202a;
  --muted: #5f6b7a;
  --line: #d9e1e8;
  --nav: #14213d;
  --nav-soft: #203454;
  --teal: #087f8c;
  --green: #2f855a;
  --gold: #b7791f;
  --magenta: #8a277f;
  --blue: #2b6cb0;
  --shadow: 0 16px 36px rgba(20, 33, 61, 0.12);
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-width: 320px;
  overflow-x: hidden;
  background: var(--bg);
  color: var(--text);
  font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}

button,
input,
select {
  font: inherit;
}

code {
  border-radius: 5px;
  background: #edf2f7;
  color: #1a365d;
  padding: 2px 5px;
}

.app-shell {
  display: grid;
  grid-template-columns: 276px minmax(0, 1fr);
  width: 100%;
  min-width: 0;
  min-height: 100vh;
}

.sidebar {
  position: sticky;
  top: 0;
  min-width: 0;
  overflow: hidden;
  height: 100vh;
  padding: 24px 18px;
  background: var(--nav);
  color: #fff;
}

.brand-block {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 28px;
}

.brand-mark {
  display: grid;
  width: 54px;
  height: 54px;
  flex: 0 0 54px;
  place-items: center;
  border: 2px solid rgba(255, 255, 255, 0.72);
  border-radius: 8px;
  background: linear-gradient(135deg, var(--magenta), var(--teal));
  box-shadow: 0 12px 28px rgba(0, 0, 0, 0.22);
}

.brand-mark span {
  color: #fff;
  font-size: 1rem;
  font-weight: 900;
  letter-spacing: 0;
}

.brand-name {
  font-weight: 850;
}

.brand-subtitle,
.eyebrow,
small,
.panel-heading span,
.table-note,
.empty-state p,
.placeholder-card p {
  color: var(--muted);
}

.sidebar .brand-subtitle {
  color: rgba(255, 255, 255, 0.68);
}

.section-nav {
  display: grid;
  min-width: 0;
  gap: 8px;
}

.nav-button {
  min-height: 42px;
  border: 1px solid transparent;
  border-radius: 8px;
  background: transparent;
  color: rgba(255, 255, 255, 0.76);
  cursor: pointer;
  padding: 10px 12px;
  text-align: left;
}

.nav-button:hover,
.nav-button.active {
  border-color: rgba(255, 255, 255, 0.18);
  background: var(--nav-soft);
  color: #fff;
}

.content {
  min-width: 0;
  padding: 28px;
}

.topbar {
  display: flex;
  align-items: end;
  justify-content: space-between;
  gap: 24px;
  margin-bottom: 18px;
}

.eyebrow {
  margin: 0 0 6px;
  color: var(--teal);
  font-size: 0.78rem;
  font-weight: 850;
  letter-spacing: 0;
  text-transform: uppercase;
}

h1,
h2,
h3,
p {
  margin-top: 0;
}

h1 {
  margin-bottom: 0;
  font-size: clamp(1.85rem, 3vw, 2.75rem);
  line-height: 1.08;
  letter-spacing: 0;
}

h2 {
  margin-bottom: 0;
  font-size: 1.38rem;
  letter-spacing: 0;
}

h3 {
  margin-bottom: 0;
  font-size: 1rem;
}

.filter-row {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  justify-content: flex-end;
}

label {
  display: grid;
  gap: 6px;
  color: var(--muted);
  font-size: 0.78rem;
  font-weight: 800;
}

select {
  min-width: 180px;
  min-height: 42px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--surface);
  color: var(--text);
  padding: 0 36px 0 12px;
}

.notice,
.loading-panel,
.panel,
.metric-card,
.placeholder-card,
.county-tile {
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--surface);
  box-shadow: var(--shadow);
}

.notice {
  margin-bottom: 18px;
  padding: 12px 14px;
  color: var(--muted);
  font-size: 0.94rem;
  overflow-wrap: anywhere;
}

.notice strong {
  color: var(--text);
}

.sections {
  min-width: 0;
}

.section-heading {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  margin-bottom: 16px;
}

.status-pill {
  display: inline-flex;
  align-items: center;
  justify-self: start;
  min-height: 28px;
  padding: 4px 10px;
  border-radius: 999px;
  background: #e6fffa;
  color: #0f766e;
  font-size: 0.78rem;
  font-weight: 850;
  white-space: nowrap;
}

.metric-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 12px;
  margin-bottom: 16px;
}

.metric-grid.hero-kpis {
  grid-template-columns: repeat(6, minmax(0, 1fr));
}

.metric-grid.compact {
  grid-template-columns: repeat(4, minmax(0, 1fr));
}

.metric-card {
  display: grid;
  gap: 7px;
  min-height: 126px;
  padding: 16px;
  border-top: 4px solid var(--blue);
}

.metric-card:nth-child(2n) {
  border-top-color: var(--teal);
}

.metric-card:nth-child(3n) {
  border-top-color: var(--green);
}

.metric-card:nth-child(4n) {
  border-top-color: var(--gold);
}

.metric-card span,
.placeholder-card span,
.county-tile span {
  color: var(--muted);
  font-size: 0.78rem;
  font-weight: 850;
  text-transform: uppercase;
}

.metric-card strong {
  overflow-wrap: anywhere;
  font-size: clamp(1.35rem, 2vw, 1.9rem);
  line-height: 1.02;
}

.metric-card small {
  line-height: 1.35;
}

.two-column {
  display: grid;
  grid-template-columns: minmax(0, 1.1fr) minmax(320px, 0.9fr);
  gap: 16px;
}

.panel {
  min-width: 0;
  padding: 18px;
}

.stacked-panel {
  margin-top: 16px;
}

.panel-heading {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 14px;
}

.panel-heading span {
  font-size: 0.8rem;
  font-weight: 800;
}

.placeholder-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 12px;
  margin-top: 16px;
}

.placeholder-grid.single {
  grid-template-columns: 1fr;
  margin-top: 0;
}

.placeholder-card {
  display: grid;
  gap: 8px;
  padding: 16px;
  border-style: dashed;
  box-shadow: none;
}

.placeholder-card strong {
  font-size: 1.02rem;
}

.placeholder-card p {
  margin-bottom: 0;
  line-height: 1.48;
}

.county-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 12px;
}

.county-tile {
  display: grid;
  gap: 14px;
  padding: 16px;
}

.county-tile strong {
  display: block;
  margin-bottom: 4px;
  font-size: 1.08rem;
}

dl {
  display: grid;
  gap: 8px;
  margin: 0;
}

dl div {
  display: flex;
  justify-content: space-between;
  gap: 12px;
}

dt {
  color: var(--muted);
}

dd {
  margin: 0;
  font-weight: 850;
}

table {
  width: 100%;
  border-collapse: collapse;
}

th,
td {
  padding: 11px 10px;
  border-bottom: 1px solid var(--line);
  text-align: left;
  vertical-align: middle;
}

th {
  color: var(--muted);
  font-size: 0.75rem;
  font-weight: 850;
  letter-spacing: 0;
  text-transform: uppercase;
}

td {
  font-size: 0.92rem;
}

.table-note {
  margin-bottom: 0;
  line-height: 1.5;
}

.loading-panel,
.empty-state {
  padding: 24px;
}

.loading-panel {
  display: grid;
  gap: 8px;
}

.loading-panel span,
.error-text {
  color: var(--muted);
}

.empty-state h2,
.empty-state h3 {
  margin-bottom: 8px;
}

.empty-state p:last-child {
  margin-bottom: 0;
}

@media (max-width: 1180px) {
  .metric-grid.hero-kpis {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }

  .county-grid {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
}

@media (max-width: 960px) {
  .app-shell {
    grid-template-columns: 1fr;
  }

  .sidebar {
    position: static;
    height: auto;
    padding: 16px;
  }

  .brand-block {
    margin-bottom: 14px;
  }

  .section-nav {
    display: flex;
    overflow-x: auto;
    max-width: 100%;
    padding-bottom: 4px;
  }

  .nav-button {
    flex: 0 0 auto;
    text-align: center;
    white-space: nowrap;
  }

  .topbar,
  .two-column {
    display: grid;
    grid-template-columns: 1fr;
  }

  .filter-row {
    justify-content: flex-start;
  }

  .metric-grid,
  .metric-grid.compact {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
}

@media (max-width: 680px) {
  .content {
    padding: 18px;
  }

  .section-nav {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    overflow: visible;
  }

  .nav-button {
    white-space: normal;
  }

  .section-heading {
    display: grid;
    align-items: start;
    grid-template-columns: 1fr;
  }

  .metric-grid,
  .metric-grid.compact,
  .metric-grid.hero-kpis,
  .placeholder-grid,
  .county-grid {
    grid-template-columns: 1fr;
  }

  select {
    width: 100%;
  }

  table {
    display: block;
    overflow-x: auto;
    white-space: nowrap;
  }
}


/* GLA dashboard date filters */
input[type="date"] {
  min-width: 155px;
  min-height: 42px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--surface);
  color: var(--text);
  padding: 0 10px;
}

@media (max-width: 680px) {
  input[type="date"] {
    width: 100%;
  }
}



.help-intro p,
.help-body p,
.help-body li {
  line-height: 1.55;
}

.help-checklist ol,
.help-body ol,
.help-body ul {
  margin: 0;
  padding-left: 1.4rem;
}

.help-checklist li,
.help-body li {
  margin-bottom: 0.5rem;
}

.help-section {
  margin-top: 14px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--surface);
  box-shadow: var(--shadow);
  overflow: hidden;
}

.help-section summary {
  padding: 16px 18px;
  cursor: pointer;
  color: var(--text);
  font-weight: 850;
}

.help-section[open] summary {
  border-bottom: 1px solid var(--line);
  background: var(--surface-soft);
}

.help-body {
  padding: 18px;
}

.help-body h3 {
  margin: 18px 0 8px;
}

.help-body h3:first-child {
  margin-top: 0;
}

.help-body pre {
  max-width: 100%;
  overflow-x: auto;
  margin: 12px 0 16px;
  padding: 14px;
  border-radius: 8px;
  background: #111827;
  color: #f9fafb;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}

.help-body pre code {
  padding: 0;
  background: transparent;
  color: inherit;
}

.help-warning {
  margin: 12px 0;
  padding: 12px 14px;
  border-left: 4px solid var(--gold);
  border-radius: 6px;
  background: #fffaf0;
  line-height: 1.5;
}

.help-table-wrap {
  overflow-x: auto;
}


.metric-card {
  position: relative;
}

.metric-card-heading {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 10px;
}

.metric-info-button {
  display: inline-grid;
  width: 24px;
  height: 24px;
  flex: 0 0 24px;
  place-items: center;
  border: 1px solid var(--line);
  border-radius: 50%;
  background: var(--surface-soft);
  color: var(--blue);
  cursor: pointer;
  font-size: 0.78rem;
  font-weight: 900;
  line-height: 1;
}

.metric-info-button:hover,
.metric-info-button[aria-expanded="true"] {
  border-color: var(--blue);
  background: var(--blue);
  color: #fff;
}

.metric-info-popover {
  position: absolute;
  z-index: 30;
  top: 46px;
  right: 12px;
  width: min(340px, calc(100vw - 48px));
  padding: 14px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--surface);
  box-shadow: 0 18px 42px rgba(20, 33, 61, 0.22);
  color: var(--text);
}

.metric-info-popover[hidden] {
  display: none;
}

.metric-info-popover div + div {
  margin-top: 10px;
}

.metric-info-popover b {
  display: block;
  margin-bottom: 3px;
  color: var(--teal);
  font-size: 0.78rem;
  text-transform: uppercase;
}

.metric-info-popover p {
  margin: 0;
  color: var(--text);
  font-size: 0.84rem;
  line-height: 1.42;
}

</style>
