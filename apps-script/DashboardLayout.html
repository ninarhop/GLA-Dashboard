<style>
.admin-nav-slot {
        margin-top: 12px;
        padding-top: 12px;
        border-top: 1px solid rgba(255, 255, 255, 0.18);
      }

      .admin-nav-link {
        display: block;
        text-decoration: none;
      }
</style>
<script>
(() => {
  const root = document.getElementById("app");
  if (!root) return;

  root.innerHTML = `
    <div class="app-shell">
      <aside class="sidebar" aria-label="Dashboard sections">
        <div class="brand-block">
          <div class="brand-mark" aria-hidden="true"><span>GLA</span></div>
          <div>
            <div class="brand-name">Get Loud Arkansas</div>
            <div class="brand-subtitle">Aggregate voter dashboard</div>
          </div>
        </div>
        <nav id="nav" class="section-nav" aria-label="Executive dashboard navigation"></nav>
<div id="adminNavSlot" class="admin-nav-slot" hidden>
          <a id="ezAdminNavLink" class="nav-button admin-nav-link" href="?view=ez-admin">
            EZ App Admin
          </a>
        </div>
      </aside>

      <main class="content">
        <header class="topbar">
          <div>
            <p class="eyebrow">GLA Dashboard</p>
            <h1>Registration, Purge, and EZ App Results</h1>
          </div>
          <div class="filter-row" aria-label="Dashboard filters">
            <label>
              Start date
              <input id="startDateFilter" type="date">
            </label>
            <label>
              End date
              <input id="endDateFilter" type="date">
            </label>
            <label>
              County
              <select id="countyFilter"><option value="all">All counties</option></select>
            </label>
          </div>
        </header>

        <div id="privacyNotice" class="notice" role="status"></div>
        <section id="sections" class="sections" aria-live="polite"></section>
      </main>
    </div>
  `;
google.script.run
    .withSuccessHandler((state) => {
      const slot = document.getElementById("adminNavSlot");
      if (!slot) return;
      if (state && state.configured && state.approved) {
        slot.hidden = false;
      }
    })
    .withFailureHandler(() => {})
    .getEzAppAdminAccessState();
})();


</script>
